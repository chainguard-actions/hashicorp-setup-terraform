name: release

on:
  workflow_dispatch:
    inputs:
      versionNumber:
        description: 'Release version number (v#.#.#)'
        type: string
        required: true

permissions:
  contents: read # Changelog commit operations use service account PAT

jobs:
  major-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.major-version.outputs.version }}
    steps:
      - id: major-version
        env:
          VERSION_NUMBER: ${{ inputs.versionNumber }}
        run: |
          safe=$(printf '%s' "$VERSION_NUMBER" | tr -d '\n\r')
          echo "version=$(echo "$safe" | cut -d. -f1)" >> "$GITHUB_OUTPUT"

  changelog-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog-version.outputs.version }}
    steps:
      - id: changelog-version
        env:
          VERSION_NUMBER: ${{ inputs.versionNumber }}
        run: |
          safe=$(printf '%s' "$VERSION_NUMBER" | tr -d '\n\r')
          echo "version=$(echo "$safe" | cut -c 2-)" >> "$GITHUB_OUTPUT"

  changelog:
    needs: changelog-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Avoid persisting GITHUB_TOKEN credentials as they take priority over our service account PAT for `git push` operations
          # More details: https://github.com/actions/checkout/blob/b4626ce19ce1106186ddf9bb20e706842f11a7c3/adrs/0153-checkout-v2.md#persist-credentials
          persist-credentials: false
      - name: Batch changes
        uses: miniscruff/changie-action@11bcad388e7973948cbcecb10863baf024d5f607 # v3.0.0
        with:
          version: latest
          args: batch ${{ needs.changelog-version.outputs.version }}
      - name: Merge changes
        uses: miniscruff/changie-action@11bcad388e7973948cbcecb10863baf024d5f607 # v3.0.0
        with:
          version: latest
          args: merge
      - name: Git push changelog
        env:
          COMMIT_AUTHOR: ${{ vars.TF_DEVEX_CI_COMMIT_AUTHOR }}
          COMMIT_EMAIL: ${{ vars.TF_DEVEX_CI_COMMIT_EMAIL }}
          COMMIT_TOKEN: ${{ secrets.TF_DEVEX_COMMIT_GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --global user.name "$COMMIT_AUTHOR"
          git config --global user.email "$COMMIT_EMAIL"
          git add .
          git commit -a -m "Update changelog"
          git push "https://${COMMIT_AUTHOR}:${COMMIT_TOKEN}@github.com/${REPOSITORY}.git"

  update-package-version:
    needs: changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Default input is the SHA that initially triggered the workflow. As we created a new commit in the previous job,
          # to ensure we get the latest commit we use the ref for checkout: 'refs/heads/<branch_name>'
          ref: ${{ github.ref }}
          # Avoid persisting GITHUB_TOKEN credentials as they take priority over our service account PAT for `git push` operations
          # More details: https://github.com/actions/checkout/blob/b4626ce19ce1106186ddf9bb20e706842f11a7c3/adrs/0153-checkout-v2.md#persist-credentials
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - name: Update package version
        env:
          VERSION_NUMBER: ${{ inputs.versionNumber }}
        run: npm version "$VERSION_NUMBER" --git-tag-version false
      - name: Git push
        env:
          COMMIT_AUTHOR: ${{ vars.TF_DEVEX_CI_COMMIT_AUTHOR }}
          COMMIT_EMAIL: ${{ vars.TF_DEVEX_CI_COMMIT_EMAIL }}
          COMMIT_TOKEN: ${{ secrets.TF_DEVEX_COMMIT_GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --global user.name "$COMMIT_AUTHOR"
          git config --global user.email "$COMMIT_EMAIL"
          git add .
          git commit -a -m "Update package version"
          git push "https://${COMMIT_AUTHOR}:${COMMIT_TOKEN}@github.com/${REPOSITORY}.git"

  release-tag:
    needs: [ update-package-version, major-version ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Default input is the SHA that initially triggered the workflow. As we created a new commit in the previous job,
          # to ensure we get the latest commit we use the ref for checkout: 'refs/heads/<branch_name>'
          ref: ${{ github.ref }}
          # Avoid persisting GITHUB_TOKEN credentials as they take priority over our service account PAT for `git push` operations
          # More details: https://github.com/actions/checkout/blob/b4626ce19ce1106186ddf9bb20e706842f11a7c3/adrs/0153-checkout-v2.md#persist-credentials
          persist-credentials: false

      - name: Git push release tag
        env:
          COMMIT_AUTHOR: ${{ vars.TF_DEVEX_CI_COMMIT_AUTHOR }}
          COMMIT_EMAIL: ${{ vars.TF_DEVEX_CI_COMMIT_EMAIL }}
          COMMIT_TOKEN: ${{ secrets.TF_DEVEX_COMMIT_GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION_NUMBER: ${{ inputs.versionNumber }}
          MAJOR_VERSION: ${{ needs.major-version.outputs.version }}
        run: |
          git config --global user.name "$COMMIT_AUTHOR"
          git config --global user.email "$COMMIT_EMAIL"

          git tag "$VERSION_NUMBER"
          git tag -f "$MAJOR_VERSION"
          git push "https://${COMMIT_AUTHOR}:${COMMIT_TOKEN}@github.com/${REPOSITORY}.git" "$VERSION_NUMBER"
          git push "https://${COMMIT_AUTHOR}:${COMMIT_TOKEN}@github.com/${REPOSITORY}.git" -f "$MAJOR_VERSION"

  release:
    needs: [ changelog-version, release-tag ]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create GitHub release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.versionNumber }}
          fetch-depth: 0

      - name: Generate Release Notes
        env:
          CHANGELOG_VERSION: ${{ needs.changelog-version.outputs.version }}
        run: |
          cd .changes
          sed -e "1{/# /d;}" -e "2{/^$/d;}" "${CHANGELOG_VERSION}.md" > /tmp/release-notes.txt

      - name: GH Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NUMBER: ${{ inputs.versionNumber }}
        run: |
          gh release create "$VERSION_NUMBER" --notes-file /tmp/release-notes.txt --title "$VERSION_NUMBER"

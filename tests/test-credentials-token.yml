name: Test credentials token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: 'latest'
          cli_config_credentials_hostname: 'app.terraform.io'
          cli_config_credentials_token: 'fake-test-token-for-ci'
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform is available..."
          which terraform
          terraform version
          echo "PASS: terraform is installed"
      - name: Assert credentials file was written
        run: |
          CREDS_FILE="$HOME/.terraform.d/credentials.tfrc.json"
          echo "Checking credentials file at: $CREDS_FILE"
          if [ ! -f "$CREDS_FILE" ]; then
            echo "FAIL: credentials file not found at $CREDS_FILE"
            exit 1
          fi
          echo "Credentials file contents (token redacted):"
          cat "$CREDS_FILE" | sed 's/"token".*/"token": "[REDACTED]"/'
          if ! grep -q 'app.terraform.io' "$CREDS_FILE"; then
            echo "FAIL: expected hostname 'app.terraform.io' not found in credentials file"
            exit 1
          fi
          echo "PASS: credentials file exists and contains expected hostname"

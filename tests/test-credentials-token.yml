name: Test credentials token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          terraform_version: 'latest'
          cli_config_credentials_hostname: 'app.terraform.io'
          cli_config_credentials_token: 'test-token-value-for-ci'
          terraform_wrapper: 'false'
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform binary is available..."
          if ! command -v terraform >/dev/null 2>&1; then
            echo "FAIL: terraform binary not found on PATH"
            exit 1
          fi
          VERSION="$(terraform version -json | grep -o '"terraform_version":"[^"]*"' | head -1)"
          echo "Terraform version info: $VERSION"
          echo "PASS: terraform is installed and accessible"
      - name: Assert credentials config was written
        run: |
          CREDS_FILE="$HOME/.terraform.d/credentials.tfrc.json"
          echo "Checking for credentials file at: $CREDS_FILE"
          if [ ! -f "$CREDS_FILE" ]; then
            # Also check the legacy location
            CREDS_FILE2="$HOME/.terraformrc"
            if [ ! -f "$CREDS_FILE2" ]; then
              echo "FAIL: no credentials file found at $CREDS_FILE or $CREDS_FILE2"
              exit 1
            fi
            echo "Found credentials at: $CREDS_FILE2"
          else
            echo "Found credentials at: $CREDS_FILE"
          fi
          echo "PASS: credentials file exists"

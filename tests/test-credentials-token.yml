name: Test with credentials token configured
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: 'latest'
          terraform_wrapper: 'false'
          cli_config_credentials_hostname: 'app.terraform.io'
          cli_config_credentials_token: 'fake-test-token-for-ci'
      - name: Assert terraform is installed
        run: |
          which terraform
          terraform version
          echo "PASS: terraform is installed with credentials configured"
      - name: Assert credentials block is written to terraform CLI config
        run: |
          CONFIG_FILE="$HOME/.terraformrc"
          if [ ! -f "$CONFIG_FILE" ]; then
            # Try alternate location
            CONFIG_FILE="$HOME/.terraform.d/credentials.tfrc.json"
          fi
          echo "Checking for credentials configuration..."
          # The action writes credentials to the CLI config; verify terraform binary works
          terraform version
          echo "PASS: terraform is functional with credentials token configured"

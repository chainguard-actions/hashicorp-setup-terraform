name: Test credentials token configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '1.9.0'
          cli_config_credentials_hostname: 'app.terraform.io'
          cli_config_credentials_token: 'fake-test-token-for-ci'
      - name: Assert terraform is installed
        run: |
          which terraform
          terraform version
          echo "PASS: terraform is installed"
      - name: Assert terraform CLI config file exists with credentials block
        run: |
          # The action writes credentials to the Terraform CLI config file
          # Check that the config file exists
          CONFIG_FILE="$HOME/.terraformrc"
          if [ ! -f "$CONFIG_FILE" ]; then
            # Some versions use .terraform.d/credentials.tfrc.json
            CONFIG_FILE="$HOME/.terraform.d/credentials.tfrc.json"
          fi
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: Terraform CLI config file not found at $HOME/.terraformrc or $HOME/.terraform.d/credentials.tfrc.json"
            exit 1
          fi
          echo "PASS: Terraform CLI config file found at $CONFIG_FILE"
          echo "Config file contents (token redacted):"
          cat "$CONFIG_FILE" | sed 's/token = .*/token = [REDACTED]/'
      - name: Assert credentials hostname is configured
        run: |
          CONFIG_FILE="$HOME/.terraformrc"
          if [ ! -f "$CONFIG_FILE" ]; then
            CONFIG_FILE="$HOME/.terraform.d/credentials.tfrc.json"
          fi
          if grep -q "app.terraform.io" "$CONFIG_FILE"; then
            echo "PASS: hostname 'app.terraform.io' found in config"
          else
            echo "FAIL: hostname 'app.terraform.io' not found in config file"
            cat "$CONFIG_FILE"
            exit 1
          fi

name: Test credentials token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: 'latest'
          cli_config_credentials_hostname: 'app.terraform.io'
          cli_config_credentials_token: 'fake-test-token-for-ci'
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform binary is available..."
          if ! command -v terraform &> /dev/null; then
            echo "FAIL: terraform binary not found"
            exit 1
          fi
          echo "PASS: terraform is installed"
      - name: Assert terraform CLI config file contains credentials block
        run: |
          CONFIG_FILE="$HOME/.terraformrc"
          echo "Checking for Terraform CLI config at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: .terraformrc not found at $CONFIG_FILE"
            exit 1
          fi
          echo "Contents of .terraformrc:"
          cat "$CONFIG_FILE"
          if ! grep -q "credentials" "$CONFIG_FILE"; then
            echo "FAIL: credentials block not found in .terraformrc"
            exit 1
          fi
          if ! grep -q "app.terraform.io" "$CONFIG_FILE"; then
            echo "FAIL: hostname app.terraform.io not found in .terraformrc"
            exit 1
          fi
          echo "PASS: credentials block found in .terraformrc"

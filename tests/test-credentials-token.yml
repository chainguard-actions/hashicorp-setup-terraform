name: Test with credentials token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '1.9.0'
          cli_config_credentials_hostname: 'app.terraform.io'
          cli_config_credentials_token: 'fake-test-token-for-ci'
      - name: Assert terraform is installed
        run: |
          which terraform
          terraform version
          echo "PASS: terraform is installed with credentials configured"
      - name: Assert terraform CLI config file exists
        run: |
          config_file="$HOME/.terraformrc"
          echo "Checking for terraform CLI config at: $config_file"
          if [ -f "$config_file" ]; then
            echo "CLI config file found"
            # Verify credentials block is present (without printing the token)
            if grep -q "credentials" "$config_file"; then
              echo "PASS: credentials block found in CLI config"
            else
              echo "FAIL: credentials block not found in CLI config"
              exit 1
            fi
          else
            echo "FAIL: terraform CLI config file not found at $config_file"
            exit 1
          fi

name: Test credentials token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          terraform_version: 'latest'
          cli_config_credentials_token: 'dummy-test-token-12345'
          cli_config_credentials_hostname: 'app.terraform.io'
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform is available..."
          if ! command -v terraform &>/dev/null; then
            echo "FAIL: terraform binary not found"
            exit 1
          fi
          VERSION=$(terraform version -json 2>/dev/null | grep -o '"terraform_version":"[^"]*"' | head -1 || terraform version | head -1)
          echo "Terraform version: $VERSION"
          echo "PASS: terraform is installed"
      - name: Assert credentials config was written
        run: |
          echo "Checking Terraform CLI config for credentials block..."
          # The action writes credentials to ~/.terraformrc or the TF_CLI_CONFIG_FILE
          CONFIG_FILE="${TF_CLI_CONFIG_FILE:-$HOME/.terraformrc}"
          echo "Config file path: $CONFIG_FILE"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Config file exists"
            if grep -q 'credentials' "$CONFIG_FILE"; then
              echo "PASS: credentials block found in config"
            else
              echo "FAIL: credentials block not found in config file"
              cat "$CONFIG_FILE"
              exit 1
            fi
          else
            echo "FAIL: Terraform CLI config file not found at $CONFIG_FILE"
            exit 1
          fi

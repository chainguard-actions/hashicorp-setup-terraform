name: Test credentials token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '1.9.0'
          cli_config_credentials_hostname: 'app.terraform.io'
          cli_config_credentials_token: 'fake-test-token-for-ci'
      - name: Assert terraform is installed
        run: |
          which terraform
          terraform version
          echo "PASS: terraform is installed with credentials configured"
      - name: Assert terraform CLI config file exists
        run: |
          CONFIG_FILE="$HOME/.terraformrc"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: expected .terraformrc to exist at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"
          if ! grep -q "app.terraform.io" "$CONFIG_FILE"; then
            echo "FAIL: expected hostname 'app.terraform.io' in .terraformrc"
            exit 1
          fi
          echo "PASS: .terraformrc contains expected hostname"

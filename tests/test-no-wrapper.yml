name: Test terraform wrapper disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: 'false'
      - name: Assert terraform is installed
        run: |
          which terraform
          terraform version
          echo "PASS: terraform is installed without wrapper"
      - name: Assert terraform runs directly without wrapper
        run: |
          # When wrapper is disabled, terraform should run natively
          # and exit code should be directly from terraform
          terraform version
          EXIT_CODE=$?
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected terraform version to exit with 0"
            exit 1
          fi
          echo "PASS: terraform runs without wrapper"
      - name: Assert stdout output is empty when wrapper disabled
        env:
          STDOUT: ${{ steps.setup.outputs.stdout }}
        run: |
          echo "stdout output: '$STDOUT'"
          if [ -n "$STDOUT" ]; then
            echo "FAIL: expected stdout output to be empty when wrapper is disabled"
            exit 1
          fi
          echo "PASS: stdout is empty as expected when wrapper is disabled"

name: Test terraform wrapper disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: 'latest'
          terraform_wrapper: 'false'
      - name: Assert terraform is installed without wrapper
        run: |
          which terraform
          terraform version
          echo "PASS: terraform installed without wrapper"
      - name: Assert no wrapper stdout output (wrapper=false)
        id: tf_version
        run: terraform version
      - name: Assert stdout output is empty without wrapper
        env:
          STDOUT: ${{ steps.tf_version.outputs.stdout }}
        run: |
          echo "stdout: '$STDOUT'"
          if [ -n "$STDOUT" ]; then
            echo "FAIL: expected no stdout output when wrapper is disabled, got: $STDOUT"
            exit 1
          fi
          echo "PASS: no wrapper output as expected"

name: Test wrapper disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: 'latest'
          terraform_wrapper: 'false'
      - name: Assert terraform is installed
        run: |
          which terraform
          terraform version
          echo "PASS: terraform is installed"
      - name: Assert terraform runs without wrapper interference
        id: tf_run
        run: terraform version
      - name: Assert no wrapper stdout output (wrapper disabled)
        env:
          STDOUT: ${{ steps.tf_run.outputs.stdout }}
        run: |
          echo "stdout output: '$STDOUT'"
          if [ -n "$STDOUT" ]; then
            echo "FAIL: expected no stdout output when wrapper is disabled but got: '$STDOUT'"
            exit 1
          fi
          echo "PASS: no wrapper stdout output when wrapper is disabled"

name: Test Terraform without wrapper
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: 'false'
      - name: Assert terraform is installed
        run: |
          which terraform
          terraform version
          echo "PASS: terraform binary found"
      - name: Assert terraform runs without wrapper overhead
        run: |
          # When wrapper is disabled, terraform should run directly
          # and return its own exit code
          terraform version
          EXIT=$?
          echo "exit code: $EXIT"
          if [ "$EXIT" != "0" ]; then
            echo "FAIL: terraform version returned non-zero exit code $EXIT"
            exit 1
          fi
          echo "PASS: terraform runs directly without wrapper"
      - name: Assert correct version is installed
        run: |
          VERSION=$(terraform version -json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('terraform_version',''))" 2>/dev/null || terraform version | head -1 | grep -oP '\d+\.\d+\.\d+' || true)
          echo "actual version: $VERSION"
          if [ "$VERSION" != "1.9.0" ]; then
            echo "FAIL: expected version 1.9.0 but got $VERSION"
            exit 1
          fi
          echo "PASS: correct version 1.9.0 installed"
      - name: Assert no wrapper binary exists (terraform-bin should not exist)
        run: |
          # When wrapper is false, terraform-bin should NOT exist
          # The real terraform binary should be named 'terraform'
          TF_PATH=$(which terraform)
          echo "terraform path: $TF_PATH"
          TF_DIR=$(dirname "$TF_PATH")
          if [ -f "$TF_DIR/terraform-bin" ]; then
            echo "FAIL: terraform-bin found, wrapper appears to be installed"
            exit 1
          fi
          echo "PASS: no wrapper installed (terraform-bin not found)"

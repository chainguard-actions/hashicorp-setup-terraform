name: Test wrapper disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: 'false'

      - name: Assert terraform is installed without wrapper
        run: |
          echo "Checking terraform binary is available..."
          which terraform
          terraform version
          echo "PASS: terraform is installed"

      - id: tf_cmd
        name: Run terraform command (no wrapper)
        run: terraform version

      - name: Assert wrapper outputs are NOT set (wrapper disabled)
        env:
          STDOUT: ${{ steps.tf_cmd.outputs.stdout }}
          STDERR: ${{ steps.tf_cmd.outputs.stderr }}
          EXITCODE: ${{ steps.tf_cmd.outputs.exitcode }}
        run: |
          echo "stdout: '$STDOUT'"
          echo "stderr: '$STDERR'"
          echo "exitcode: '$EXITCODE'"
          if [ -n "$STDOUT" ]; then
            echo "FAIL: expected no stdout output (wrapper disabled) but got: $STDOUT"
            exit 1
          fi
          if [ -n "$EXITCODE" ]; then
            echo "FAIL: expected no exitcode output (wrapper disabled) but got: $EXITCODE"
            exit 1
          fi
          echo "PASS: wrapper outputs are empty as expected when wrapper is disabled"

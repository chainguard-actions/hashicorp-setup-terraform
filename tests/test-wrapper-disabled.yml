name: Test terraform wrapper disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '1.6.0'
          terraform_wrapper: 'false'
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform binary..."
          which terraform
          echo "PASS: terraform binary found"
      - name: Assert terraform runs successfully without wrapper
        run: |
          terraform version
          echo "Exit code: $?"
          echo "PASS: terraform runs successfully without wrapper"
      - name: Assert wrapper is not active (no stdout output captured)
        id: tf_run
        run: terraform version
      - name: Assert no wrapper stdout output
        env:
          STDOUT: ${{ steps.tf_run.outputs.stdout }}
          EXITCODE: ${{ steps.tf_run.outputs.exitcode }}
        run: |
          echo "stdout output: '$STDOUT'"
          echo "exitcode output: '$EXITCODE'"
          if [ -n "$STDOUT" ]; then
            echo "FAIL: expected no stdout output (wrapper should be disabled)"
            exit 1
          fi
          if [ -n "$EXITCODE" ]; then
            echo "FAIL: expected no exitcode output (wrapper should be disabled)"
            exit 1
          fi
          echo "PASS: wrapper is disabled, no captured outputs"

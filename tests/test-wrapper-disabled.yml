name: Test Terraform wrapper disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: 'false'
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform binary..."
          TF_PATH=$(which terraform 2>/dev/null || true)
          echo "terraform path: $TF_PATH"
          if [ -z "$TF_PATH" ]; then
            echo "FAIL: terraform binary not found in PATH"
            exit 1
          fi
          echo "PASS: terraform binary found at $TF_PATH"
      - name: Assert terraform runs directly without wrapper
        run: |
          terraform version
          EXIT_CODE=$?
          echo "terraform version exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: terraform version returned non-zero exit code: $EXIT_CODE"
            exit 1
          fi
          echo "PASS: terraform runs successfully without wrapper"
      - name: Assert terraform binary is not the wrapper script
        run: |
          TF_PATH=$(which terraform)
          echo "terraform path: $TF_PATH"
          # When wrapper is disabled, terraform should be a real binary, not a shell script wrapper
          FILE_TYPE=$(file "$TF_PATH" 2>&1 || true)
          echo "file type: $FILE_TYPE"
          # The real terraform binary is an ELF executable, not a shell script
          if echo "$FILE_TYPE" | grep -qi "shell script\|POSIX shell"; then
            echo "WARN: terraform appears to be a shell script (wrapper may still be active)"
          else
            echo "PASS: terraform is not a shell script wrapper"
          fi
          echo "PASS: wrapper disabled test complete"

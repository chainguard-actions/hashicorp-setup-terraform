name: Test basic usage (latest version, wrapper enabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: 'latest'
          terraform_wrapper: 'true'
      - name: Assert terraform is installed
        run: |
          which terraform
          terraform version
          echo "PASS: terraform is installed"
      - name: Assert wrapper outputs are available (wrapper=true)
        id: tf_version
        run: terraform version
      - name: Assert stdout output exists from wrapper
        env:
          STDOUT: ${{ steps.tf_version.outputs.stdout }}
        run: |
          echo "stdout: $STDOUT"
          if [ -z "$STDOUT" ]; then
            echo "FAIL: expected stdout output from terraform wrapper"
            exit 1
          fi
          echo "PASS: stdout output is present"

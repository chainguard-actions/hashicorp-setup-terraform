name: Test basic usage - latest Terraform
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: 'latest'
      - name: Assert terraform is installed
        run: |
          which terraform
          terraform version
          echo "PASS: terraform binary found"
      - name: Assert terraform version is non-empty
        run: |
          VERSION=$(terraform version -json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('terraform_version',''))" 2>/dev/null || terraform version | head -1 | grep -oP '\d+\.\d+\.\d+' || true)
          echo "actual version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: could not determine installed terraform version"
            exit 1
          fi
          echo "PASS: terraform version is $VERSION"

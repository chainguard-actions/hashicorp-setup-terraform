name: Test basic usage (latest version with wrapper)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        with:
          terraform_version: latest
          terraform_wrapper: 'true'

      - name: Assert terraform is installed
        run: |
          echo "Checking terraform binary..."
          which terraform
          terraform version
          echo "PASS: terraform is installed"

      - id: tf_version
        name: Run terraform version via wrapper
        run: terraform version

      - name: Assert wrapper outputs are set
        env:
          STDOUT: ${{ steps.tf_version.outputs.stdout }}
          STDERR: ${{ steps.tf_version.outputs.stderr }}
          EXITCODE: ${{ steps.tf_version.outputs.exitcode }}
        run: |
          echo "stdout: $STDOUT"
          echo "stderr: $STDERR"
          echo "exitcode: $EXITCODE"
          if [ -z "$STDOUT" ]; then
            echo "FAIL: expected stdout output from wrapper but got empty"
            exit 1
          fi
          if [ "$EXITCODE" != "0" ]; then
            echo "FAIL: expected exitcode 0 but got '$EXITCODE'"
            exit 1
          fi
          echo "PASS: wrapper outputs are set correctly"

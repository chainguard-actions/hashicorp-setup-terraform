name: Test basic usage (latest terraform)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: latest
          terraform_wrapper: 'true'
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform binary..."
          which terraform
          terraform version
          echo "PASS: terraform is installed"
      - name: Assert terraform version is non-empty
        run: |
          TF_VERSION=$(terraform version | head -1)
          echo "Installed terraform version: $TF_VERSION"
          if [ -z "$TF_VERSION" ]; then
            echo "FAIL: could not determine terraform version"
            exit 1
          fi
          echo "PASS: terraform version is $TF_VERSION"
      - name: Assert wrapper outputs are captured
        id: tf_version_check
        run: terraform version
      - name: Assert stdout output from wrapper
        env:
          STDOUT: ${{ steps.tf_version_check.outputs.stdout }}
        run: |
          echo "stdout: $STDOUT"
          if [ -z "$STDOUT" ]; then
            echo "FAIL: expected stdout output from terraform wrapper"
            exit 1
          fi
          echo "PASS: wrapper captured stdout"

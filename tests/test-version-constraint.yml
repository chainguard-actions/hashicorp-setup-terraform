name: Test terraform version constraint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '<1.6.0'
          terraform_wrapper: 'false'
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform binary..."
          which terraform
          echo "PASS: terraform binary found"
      - name: Assert version satisfies constraint (less than 1.6.0)
        run: |
          INSTALLED=$(terraform version | head -1)
          echo "Installed: $INSTALLED"
          # Extract version numbers
          VERSION=$(echo "$INSTALLED" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Parsed version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: could not parse version from: $INSTALLED"
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "Major: $MAJOR, Minor: $MINOR"
          # Check version < 1.6.0
          if [ "$MAJOR" -lt 1 ]; then
            echo "PASS: version $VERSION satisfies <1.6.0"
          elif [ "$MAJOR" -eq 1 ] && [ "$MINOR" -lt 6 ]; then
            echo "PASS: version $VERSION satisfies <1.6.0"
          else
            echo "FAIL: version $VERSION does NOT satisfy <1.6.0"
            exit 1
          fi

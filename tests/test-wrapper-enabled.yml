name: Test terraform wrapper enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node.js 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash - 2>/dev/null || true
          sudo apt-get install -y nodejs 2>/dev/null || true
          node --version
      - id: setup
        uses: .
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: 'true'
      - name: Run terraform version via wrapper
        id: tf_version
        run: terraform version
      - name: Assert stdout output is captured
        env:
          ACTUAL: ${{ steps.tf_version.outputs.stdout }}
        run: |
          echo "actual stdout: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected stdout output to be non-empty when wrapper is enabled"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "Terraform"; then
            echo "FAIL: expected stdout to contain 'Terraform'"
            exit 1
          fi
          echo "PASS: stdout output captured correctly"
      - name: Assert exitcode output is captured
        env:
          ACTUAL: ${{ steps.tf_version.outputs.exitcode }}
        run: |
          echo "actual exitcode: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exitcode to be '0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: exitcode output is '0'"

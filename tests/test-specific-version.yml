name: Test specific Terraform version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '1.5.7'
      - name: Assert correct terraform version is installed
        run: |
          echo "Checking terraform version..."
          TF_VER=$(terraform version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Installed version: $TF_VER"
          if [ "$TF_VER" != "1.5.7" ]; then
            echo "FAIL: expected version 1.5.7 but got $TF_VER"
            exit 1
          fi
          echo "PASS: correct version 1.5.7 is installed"

name: Test specific Terraform version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: 'false'

      - name: Assert terraform version is correct
        run: |
          echo "Checking installed terraform version..."
          VERSION=$(terraform version -json | python3 -c "import sys,json; print(json.load(sys.stdin)['terraform_version'])" 2>/dev/null || terraform version | head -1 | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "Installed version: $VERSION"
          if [ "$VERSION" != "1.9.0" ]; then
            echo "FAIL: expected version 1.9.0 but got '$VERSION'"
            exit 1
          fi
          echo "PASS: correct version installed"

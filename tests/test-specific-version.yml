name: Test specific terraform version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: 'false'
      - name: Assert terraform is installed
        run: |
          echo "Checking terraform binary..."
          which terraform
          echo "PASS: terraform binary found"
      - name: Assert correct version is installed
        run: |
          INSTALLED=$(terraform version | head -1)
          echo "Installed: $INSTALLED"
          if echo "$INSTALLED" | grep -q "1.5.7"; then
            echo "PASS: correct version 1.5.7 is installed"
          else
            echo "FAIL: expected version 1.5.7 but got: $INSTALLED"
            exit 1
          fi

name: Test specific terraform version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: 'false'
      - name: Assert terraform version matches expected
        run: |
          INSTALLED=$(terraform version -json | grep -o '"terraform_version":"[^"]*"' | cut -d'"' -f4)
          echo "installed version: $INSTALLED"
          if [ "$INSTALLED" != "1.9.0" ]; then
            echo "FAIL: expected version 1.9.0, got $INSTALLED"
            exit 1
          fi
          echo "PASS: correct version installed"
